<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallBridge AI | Responsible AI in Healthcare Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
</head>
<body>
    <header class="site-header">
        <a href="https://www.wallbridge.ai" class="brand" target="_blank" rel="noopener" aria-label="WallBridge AI website">
            <img src="{{ url_for('static', filename='images/wallbridge-logo.svg') }}" alt="WallBridge AI" class="logo">
        </a>
        <div class="header-title">
            <span class="eyebrow">Live demo</span>
            <h1>Responsible AI in Healthcare</h1>
        </div>
        <label class="guard-toggle" title="Switch guardrails on or off for the next message">
            <span class="guard-label">Guardrails</span>
            <input type="checkbox" id="guardrails-toggle" checked>
            <span class="switch" aria-hidden="true"></span>
            <span class="guard-state" id="guard-state">On</span>
        </label>
    </header>

    <main class="app">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p class="talk">Demo for <em>Navigating AI Research Risk and Responsibility in Healthcare</em></p>
        <div class="collab">
            <span>In collaboration with</span>
            <a href="https://www.valix.ai" target="_blank" rel="noopener" aria-label="Valix AI website">
                <img src="{{ url_for('static', filename='images/valix-logo.svg') }}" alt="Valix AI" class="valix-logo">
            </a>
            <a href="https://www.uhas.edu.gh" target="_blank" rel="noopener" aria-label="University of Health and Allied Sciences, Ho website">
                <img src="{{ url_for('static', filename='images/uhas-logo.png') }}" alt="University of Health and Allied Sciences, Ho" class="uhas-logo">
            </a>
        </div>
    </footer>
</body>
</html>
